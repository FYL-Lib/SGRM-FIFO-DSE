[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgrm"
version = "0.1.0"
description = "Sensitivity-Guided Resource Minimization for FIFO design-space exploration"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[project.scripts]
sgrm-trace-search = "sgrm.cli:main"
sgrm-trace-batch = "sgrm.batch_cli:main"
sgrm-verify-results = "sgrm.verify_cli:main"
sgrm-build-manifest = "sgrm.build_manifest_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
